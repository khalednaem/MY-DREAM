<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حلمي الجميل 🌙</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050817;color:white;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
#app{position:relative;width:100vw;height:100dvh}
canvas{position:absolute;inset:0;display:block}
.panel{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(90deg,#05081722,#05081766);pointer-events:none}
h1{font-size:clamp(30px,6vw,58px);text-shadow:0 0 25px #a9a4ff;margin:0 0 15px}
p{font-size:clamp(16px,3vw,22px);line-height:1.9;max-width:650px}
button{pointer-events:auto;cursor:pointer;border:1px solid #eee;border-radius:30px;padding:14px 28px;color:white;background:#27264d99;font-size:18px;backdrop-filter:blur(8px)}
button:hover{background:#5551a5}
#dreamUI,#ending{display:none}
#timer{font-size:15px;color:#d8d4ff}
#hint{font-size:13px;color:#d1d0e7}
</style>
</head>

<body>
<div id="app">
  <div class="panel" id="intro">
    <h1>أغمض عينيك يا خالد 🌙</h1>
    <p>سيب الدنيا تهدى شوية...<br>وتعالى نعيش حلم جميل.</p>
    <button id="enter">✨ ادخل الحلم</button>
    <p id="hint">ارفع صوتك لو حابب تسمع موسيقى هادئة.</p>
  </div>

  <div class="panel" id="dreamUI">
    <h1>عالم الأحلام 🤍</h1>
    <p id="memory">فيه حكايات جميلة لسه مستنيانا...</p>
    <p id="timer">01:00</p>
    <button id="next">الذكرى التالية ✨</button>
  </div>

  <div class="panel" id="ending">
    <h1>يمكن الأحلام بتخلص…</h1>
    <p>بس اللحظات الحلوة بتفضل عايشة جوانا. 🤍</p>
    <button id="again">ابدأ الحلم من جديد</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b25);
scene.fog = new THREE.FogExp2(0x080b25, 0.018);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 2, 12);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bbaff, 0x17152d, 2));
const moonLight = new THREE.PointLight(0xaaaaff, 50, 80);
moonLight.position.set(5, 8, -3);
scene.add(moonLight);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x11172d, roughness:1})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -2;
scene.add(floor);

// نجوم ثلاثية الأبعاد
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];
for(let i=0;i<1300;i++){
  starPositions.push((Math.random()-.5)*130, Math.random()*55-5, (Math.random()-.5)*130);
}
starGeometry.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
const stars = new THREE.Points(starGeometry,new THREE.PointsMaterial({
  color:0xe1e4ff,size:.16,transparent:true,opacity:.9
}));
scene.add(stars);

// القمر
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(1.6,32,32),
  new THREE.MeshBasicMaterial({color:0xe0ddff})
);
moon.position.set(7,7,-16);
scene.add(moon);

// سحاب من كرات ناعمة
const clouds = new THREE.Group();
const cloudMaterial = new THREE.MeshStandardMaterial({
  color:0x7b83c6,transparent:true,opacity:.35,roughness:1
});
for(let i=0;i<24;i++){
  const cloud = new THREE.Mesh(
    new THREE.SphereGeometry(1,16,12),
    cloudMaterial
  );
  cloud.scale.set(1+Math.random()*2,.4+Math.random()*.5,.7+Math.random());
  cloud.position.set((Math.random()-.5)*38,Math.random()*13-1,-8-Math.random()*30);
  clouds.add(cloud);
}
scene.add(clouds);

// جزيرة حالمة عائمة
const island = new THREE.Group();
const top = new THREE.Mesh(
  new THREE.CylinderGeometry(4.5,1.1,2.5,7),
  new THREE.MeshStandardMaterial({color:0x33365e,roughness:1})
);
top.position.y=-.2;
island.add(top);
const grass = new THREE.Mesh(
  new THREE.CylinderGeometry(4.3,4.3,.25,32),
  new THREE.MeshStandardMaterial({color:0x315b54})
);
grass.position.y=1.1;
island.add(grass);
island.position.set(0,-1,-13);
scene.add(island);

// كلب أبيض تخيلي بسيط ثلاثي الأبعاد
const dog = new THREE.Group();
const white = new THREE.MeshStandardMaterial({color:0xf5f2ed,roughness:.85});
const dark = new THREE.MeshStandardMaterial({color:0x252536});
function ball(parent, material, pos, scale){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),material);
  m.position.set(...pos);m.scale.set(...scale);parent.add(m);return m;
}
ball(dog,white,[0,.2,0],[.85,.48,.45]);
ball(dog,white,[.62,.48,-.02],[.42,.4,.38]);
ball(dog,dark,[.91,.53,-.33],[.055,.055,.04]);
ball(dog,dark,[.91,.53,.33],[.055,.055,.04]);
const ear1=ball(dog,white,[.42,.8,-.27],[.12,.3,.13]);
ear1.rotation.z=-.35;
const ear2=ball(dog,white,[.42,.8,.27],[.12,.3,.13]);
ear2.rotation.z=-.35;
for(const x of [-.48,.42]){
  for(const z of [-.25,.25]) ball(dog,white,[x,-.25,z],[.14,.42,.14]);
}
dog.position.set(-1,1.2,-8);
dog.scale.setScalar(.8);
dog.visible=false;
scene.add(dog);

// ضوء سحري
const glow = new THREE.PointLight(0xb5a8ff,12,18);
glow.position.set(0,3,-7);
scene.add(glow);

const memories=[
"كلبتك البيضاء بتجري ناحيتك بفرحة 🤍🐕",
"تجروا سوا وسط العشب، ومفيش حاجة مستعجلة 🌿",
"تقعد جنبك، وتحس إن الدنيا بقت أهدى.",
"تمشوا وسط السحاب والنجوم 🌙",
"تلعبوا سوا في عالم مفيهوش غير الفرح ✨",
"تقعدوا قدام الغروب، وتعيشوا اللحظة ❤️"
];

let dreaming=false, startTime=0, memoryIndex=0, lastMemory=0;
const intro=document.getElementById('intro');
const dreamUI=document.getElementById('dreamUI');
const ending=document.getElementById('ending');
const memory=document.getElementById('memory');
const timer=document.getElementById('timer');

function enterDream(){
  dreaming=true;
  startTime=performance.now();
  memoryIndex=0;
  lastMemory=0;
  intro.style.display='none';
  ending.style.display='none';
  dreamUI.style.display='flex';
  camera.position.set(0,2,12);
  dog.visible=true;
  memory.textContent=memories[0];
}
document.getElementById('enter').addEventListener('click',enterDream);
document.getElementById('next').addEventListener('click',()=>{
  memoryIndex=(memoryIndex+1)%memories.length;
  memory.textContent=memories[memoryIndex];
  lastMemory=performance.now();
});
document.getElementById('again').addEventListener('click',()=>{
  dreaming=false;
  ending.style.display='none';
  intro.style.display='flex';
  dog.visible=false;
  camera.position.set(0,2,12);
});
function animate(now){
  requestAnimationFrame(animate);
  const t=now*.001;
  stars.rotation.y=t*.008;
  clouds.position.x=Math.sin(t*.12)*1.4;
  moon.position.y=7+Math.sin(t*.3)*.15;
  island.rotation.y=Math.sin(t*.2)*.04;
  dog.position.y=1.2+Math.sin(t*2.2)*.12;
  dog.position.x=-1+Math.sin(t*.7)*.65;
  dog.rotation.y=Math.sin(t*.8)*.25;

  if(dreaming){
    const elapsed=(now-startTime)/1000;
    const left=Math.max(0,60-Math.floor(elapsed));
    timer.textContent='الوقت المتبقي في الحلم: 00:'+String(left).padStart(2,'0');
    if(now-lastMemory>=10000){
      memoryIndex=(memoryIndex+1)%memories.length;
      memory.textContent=memories[memoryIndex];
      lastMemory=now;
    }
    camera.position.x=Math.sin(t*.25)*.6;
    camera.position.y=2+Math.sin(t*.4)*.25;
    camera.position.z=12-elapsed*.045;
    camera.lookAt(0,1,-8);
    if(elapsed>=60){
      dreaming=false;
      dreamUI.style.display='none';
      ending.style.display='flex';
    }
  }else{
    camera.position.x=Math.sin(t*.12)*.12;
    camera.position.y=2+Math.sin(t*.5)*.06;
    camera.lookAt(0,1,-4);
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
