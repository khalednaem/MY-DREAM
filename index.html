<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حلمي الجميل 🌙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080d20;
    color: white;
    text-align: center;
}

section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    position: relative;
    overflow: hidden;
}

#intro {
    background:
    linear-gradient(rgba(5,8,25,.5), rgba(5,8,25,.8)),
    url("WhatsApp%20Image%202026-10-28%20at%2012.32.15%20PM.jpeg")
    center/cover no-repeat;
}

h1 {
    font-size: clamp(32px, 7vw, 55px);
    text-shadow: 0 0 20px #a9b8ff;
}

p {
    font-size: 20px;
    line-height: 1.8;
}

button {
    padding: 15px 30px;
    margin-top: 20px;
    border: 1px solid white;
    border-radius: 30px;
    background: rgba(90, 90, 180, .5);
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #6666bb;
}

#dream {
    display: none;
    background:
    linear-gradient(rgba(5,8,25,.45), rgba(5,8,25,.7)),
    url("dream.jpg") center/cover no-repeat;
}

#message {
    transition: opacity 1s;
}

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: .35;
    animation: sparkle 5s infinite alternate;
}

.content {
    position: relative;
    z-index: 1;
    max-width: 700px;
}

@keyframes sparkle {
    from { opacity: .15; }
    to { opacity: .55; }
}
</style>
</head>

<body>

<section id="intro">
    <div class="stars"></div>

    <div class="content">
        <h1>أغمض عينيك يا خالد 🌙</h1>

        <p>
            سيب الدنيا تهدى شوية...
            <br>
            وتعالى نعيش حلم جميل.
        </p>

        <button onclick="startDream()">
            ✨ ادخل الحلم
        </button>
    </div>
</section>

<section id="dream">
    <div class="stars"></div>

    <div class="content">
        <h1>عالم الأحلام 🤍</h1>

        <p id="message">
            هنا تبدأ أجمل الحكايات...
        </p>

        <p id="timer">01:00</p>
    </div>
</section>

<script>
const memories = [
    "تخيل كلبتك البيضاء وهي بتجري ناحيتك بفرحة 🤍🐕",
    "إنت وهي بتلعبوا وسط العشب الأخضر 🌿",
    "تمشوا سوا تحت ضوء القمر 🌙",
    "تقعد جنبك وإنت بتبص للنجوم ✨",
    "تجروا سوا وقت الغروب 🌅",
    "لحظات جميلة تتمنى إنها متخلصش ❤️"
];

let index = 0;
let remaining = 60;
let memoryInterval;
let timerInterval;

function startDream() {
    document.getElementById("intro").style.display = "none";
    document.getElementById("dream").style.display = "flex";

    showMemory();

    memoryInterval = setInterval(showMemory, 10000);

    timerInterval = setInterval(() => {
        remaining--;

        let minutes = Math.floor(remaining / 60);
        let seconds = remaining % 60;

        document.getElementById("timer").textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (remaining <= 0) {
            clearInterval(memoryInterval);
            clearInterval(timerInterval);

            document.getElementById("message").textContent =
                "يمكن الأحلام بتخلص، بس الذكريات الحلوة بتفضل جوانا. 🤍";

            document.getElementById("timer").textContent = "نهاية الحلم 🌅";
        }
    }, 1000);
}

function showMemory() {
    const message = document.getElementById("message");

    message.style.opacity = 0;

    setTimeout(() => {
        message.textContent = memories[index];
        message.style.opacity = 1;

        index = (index + 1) % memories.length;
    }, 800);
}
</script>

</body>
</html>
